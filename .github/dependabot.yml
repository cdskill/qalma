version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
      prosemirror:
        patterns:
          - 'prosemirror-*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
